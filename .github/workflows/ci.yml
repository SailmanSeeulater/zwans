name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ripgrep (used by the Glob and Grep tools)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep (used by the Glob and Grep tools)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress
      - name: Build the sandbox images (used by the Docker executor tests)
        if: runner.os == 'Linux'
        run: |
          docker build -t zwans-sandbox:0.1 sandbox-image
          docker build -t zwans-proxy:0.1 sandbox-image/proxy
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  web:
    name: web (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  jail:
    name: jail (cargo, escape suite, startup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Let unprivileged users make namespaces (Ubuntu 24.04 restricts it with AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: sudo apt-get update && sudo apt-get install -y libseccomp-dev ripgrep
      - name: Build zwans-jail
        working-directory: runtime
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings
          cargo build --release
      - name: Delegate a cgroup subtree to this user, as systemd does for a desktop login
        run: |
          sudo mkdir -p /sys/fs/cgroup/zwans-ci/main
          echo "+memory +pids" | sudo tee /sys/fs/cgroup/zwans-ci/cgroup.subtree_control
          sudo chown -R "$(id -u)" /sys/fs/cgroup/zwans-ci
      - run: python -m pip install -e ".[dev]"
      - name: Escape suite, inside the delegated cgroup
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/zwans-ci/main/cgroup.procs
          pytest -q tests/test_jail.py
      - name: Startup, against Docker on the same machine
        run: |
          python runtime/bench.py jail
          docker build -q -t zwans-sandbox:0.1 sandbox-image
          python runtime/bench.py docker
