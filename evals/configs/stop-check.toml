# Zwans may not finish while the repo's own (visible) tests fail: a stop hook runs them when
# the agent says it's done and, if they fail, sends it back with the end of pytest's output.
# It does so at most 3 times a turn, and only after a turn that may have changed files.
# Hidden tests still decide the pass, so this measures what checking its own work buys.

[[hooks]]
event = "stop"
max_blocks = 3
when = "changed"
timeout = 300
command = """
out=$(python -m pytest -q -p no:cacheprovider 2>&1); code=$?
[ "$code" -eq 5 ] && exit 0
[ "$code" -eq 0 ] && exit 0
printf 'The tests still fail. The end of `python -m pytest -q`:\\n%s\\n' "$(printf '%s\\n' "$out" | tail -n 40)" >&2
exit 1
"""
