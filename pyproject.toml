[project]
name = "zwans"
version = "0.1.0"
description = "A coding agent built from scratch: the loop, the tools, the sandbox, and the evals."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12",
    "fastapi>=0.115",  # zwans serve
    "httpx>=0.27",  # the MCP client's HTTP transport
    "prompt-toolkit>=3.0",  # the chat's input line
    "pydantic>=2.10",
    "pypdf>=5",  # Read on a PDF
    "rich>=13.7",  # the chat's markdown
    "typer>=0.15",
    "tzdata; sys_platform == 'win32'",  # Cron's time zones: Windows has no zone database
    "uvicorn>=0.30",
    "websockets>=13",  # the server's WebSockets, and zwans attach
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]  # the Browser tool
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
zwans = "zwans.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zwans"]

[tool.hatch.build.targets.wheel.hooks.custom]  # hatch_build.py: adds the built web UI

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "*.md",
    "evals/tasks",
    "evals/tasks-hard",
    "evals/tasks-expert",
    "evals/tasks-long",
    "evals/tasks-injection",
]  # task repos hold deliberately flawed code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["src/zwans/demo/calc/"]  # the demo's sample project, not part of Zwans
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Optional (zwans[browser]); CI type-checks without it, and browser.py holds its objects as Any.
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
