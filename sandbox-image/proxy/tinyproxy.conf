Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 100
LogLevel Notice
# Only the sandbox network can reach this container, so any client may connect.
Allow 0.0.0.0/0
# Hosts not matched by allow.txt get a 403.
Filter "/etc/tinyproxy/allow.txt"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
FilterCaseSensitive Off
# HTTPS goes through CONNECT, to port 443 only.
ConnectPort 443
